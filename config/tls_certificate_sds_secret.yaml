resources:
  - "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret"
    name: tls_sds
    tls_certificate:
      certificate_chain:
        filename: /var/run/certs/server.crt
      private_key:
        filename: /var/run/certs/server.key
      password:
        inline_string: "changeme"
